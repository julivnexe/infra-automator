---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - htop
      - unattended-upgrades
      - apt-listchanges
      - tzdata
    state: present

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Create non-root admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Allow passwordless sudo for admin
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ admin_user }}"
    mode: "0440"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: visudo -cf %s

- name: Copy authorized_keys from root to admin user
  ansible.builtin.copy:
    src: /root/.ssh/authorized_keys
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    remote_src: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"

- name: Ensure .ssh directory ownership
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
