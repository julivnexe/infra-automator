---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default policies
  community.general.ufw:
    direction: "{{ item.dir }}"
    policy: "{{ item.policy }}"
  loop:
    - { dir: incoming, policy: deny }
    - { dir: outgoing, policy: allow }

- name: Allow SSH on configured port
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow HTTP/HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: Allow extra ports defined in inventory
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ extra_open_ports }}"
  when: extra_open_ports | length > 0

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: low
