[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-automator"
version = "0.1.0"
description = "Opinionated CLI to provision, harden, deploy and tear down small cloud footprints."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "infra-automator contributors" }]
keywords = ["devops", "terraform", "ansible", "cli", "automation", "iac"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "paramiko>=3.4",
    "requests>=2.32",
    "PyYAML>=6.0",
]

[project.scripts]
infra = "infra.cli:cli"

[project.urls]
Homepage = "https://github.com/julivnexe/infra-automator"
Issues = "https://github.com/julivnexe/infra-automator/issues"

[tool.setuptools.packages.find]
include = ["infra*"]
exclude = ["tests*"]

# --- Tooling ---------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
